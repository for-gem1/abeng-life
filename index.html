<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Bengkel Life</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bengkel Life">
<meta name="theme-color" content="#20262b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#20262b;--cd:#2b333a;--ln:#3a444c;--ac:#f2c230;--tx:#f1efe8;--mu:#9aa5ad;--ok:#6cc24a;--bd:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 "Nunito",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 6px}
.day{font-weight:800;font-size:17px}
.plat{background:var(--ac);color:#111;font:800 16px/1 ui-monospace,Menlo,monospace;padding:7px 10px;border-radius:6px;border:2px solid #111;box-shadow:0 0 0 2px var(--ac)}
.rep{font-weight:800}
#gt{font-size:12px;color:var(--mu);display:flex;justify-content:space-between;margin-bottom:4px}
.pb{height:6px;background:var(--ln);border-radius:3px;overflow:hidden}
.pb span{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
main{flex:1;overflow-y:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
h4{margin:14px 0 6px;font-size:13px;color:var(--mu);font-weight:800}
.card{display:flex;gap:10px;align-items:center;background:var(--cd);border-radius:12px;padding:10px;margin-bottom:8px;border-left:5px solid var(--ln)}
.card.oj{border-left-color:var(--ok)}
.card:active{transform:scale(.985)}
.av{font-size:30px}
.inf{flex:1;min-width:0}
.inf small,.m small{color:var(--mu)}
.inf i{font-style:normal;font-size:11px;background:var(--ok);color:#111;border-radius:4px;padding:1px 5px;font-weight:800;margin-left:4px}
.inf .pb{margin-top:6px;height:4px}
.inf .pb span{background:var(--ac)}
.fee{font-weight:800;color:var(--ac);white-space:nowrap}
.empty{text-align:center;color:var(--mu);padding:22px 10px;background:var(--cd);border-radius:12px}
.m{background:var(--cd);border-radius:12px;padding:10px;margin-bottom:8px}
.m small{display:block}
.m .pb{margin:6px 0 4px}
.m .pb span{background:var(--ac)}
footer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 0 10px}
.b{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-family:inherit;font-weight:800;font-size:15px;background:var(--ln);color:var(--tx);margin-top:8px}
.b:active{filter:brightness(1.2)}
.b:disabled{opacity:.5}
.b.p{background:var(--ac);color:#111}
.b.x{background:var(--bd);color:#fff;opacity:.6}
footer .b{margin:0;padding:11px 4px;font-size:13px}
#bt{grid-column:span 2}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:9}
#modal[hidden]{display:none}
#box{width:100%;max-width:480px;background:var(--bg);border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;border-top:4px solid var(--ac)}
#box h3{margin:0 0 6px;font-size:19px}
#box p,#box .tx{margin:6px 0;line-height:1.5}
.hint{color:var(--mu);font-style:italic}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:var(--ac);color:#111;font-weight:800;padding:10px 14px;border-radius:10px;max-width:92%;text-align:center;transition:transform .25s;z-index:30}
#toast.on{transform:translate(-50%,0)}
.tap{font-size:20px;padding:20px}
.up{display:flex;justify-content:space-between;gap:8px;text-align:left}
.up small{display:block;font-weight:400;opacity:.8}
.tb{position:relative;height:36px;background:var(--cd);border-radius:8px;margin:10px 0;overflow:hidden}
.tb i{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.85}
.tb b{position:absolute;top:0;bottom:0;width:4px;background:#fff;margin-left:-2px}
.bg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.bd{text-align:center;background:var(--cd);border-radius:12px;padding:10px 4px;font-size:11px;line-height:1.25}
.bd .e{font-size:30px;display:block}
.bd.lk{filter:grayscale(1);opacity:.4}
.rv{background:var(--cd);border-radius:10px;padding:9px;margin-bottom:6px}
.rv.bad{border-left:4px solid var(--bd)}
#sp{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;transition:opacity .5s}
#sp.off{opacity:0;pointer-events:none}
#sp .lg{font-size:64px;animation:sp 2.4s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#sp h1{margin:0;font-size:36px;font-weight:800;letter-spacing:2px;color:var(--ac)}
#sp p{margin:0;color:var(--mu)}
#sp .pb{width:70%;max-width:260px;height:8px}
#sp .rd{position:absolute;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));height:6px;background:repeating-linear-gradient(90deg,var(--ac) 0 28px,transparent 28px 56px);animation:rd 1s linear infinite}
@keyframes rd{to{background-position:56px 0}}
#spt{font-size:13px;color:var(--mu);min-height:20px}
#sp.rdy #spt{color:var(--ac);font-weight:800}
</style>
</head>
<body>
<div id="sp"><div class="lg">🔧</div><h1>BENGKEL LIFE</h1><p>Bengkel Jaya Motor, sejak 2003</p><div class="pb"><span id="spb" style="width:0"></span></div><div id="spt">Memanaskan mesin...</div><div class="rd"></div></div>
<div id="app">
  <header><span class="day" id="day"></span><span class="rep" id="rep"></span><span class="plat" id="cash"></span></header>
  <div id="gt"><span id="g1"></span><span id="g2"></span></div><div class="pb" style="margin-bottom:6px"><span id="gbar"></span></div>
  <main>
    <h4>Antrean pelanggan, tap untuk servis</h4>
    <div id="queue"></div>
    <h4>Misi</h4>
    <div id="ms"></div>
  </main>
  <footer><button class="b" id="bu">🛠 Upgrade</button><button class="b" id="bv">💬 Ulasan</button><button class="b" id="bb">🏅 Badge</button><button class="b p" id="bt">🌙 Tutup Bengkel</button><button class="b" id="br">⟲ Ulang</button></footer>
</div>
<div id="modal" hidden><div id="box"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),f=n=>Math.round(n).toLocaleString("id-ID"),R=n=>Math.random()*n|0;
const SAVE="bengkelLife.v2",TARGET=4000000,MAXDAY=30,MAKAN=25000,GAJI=35000;
// [motor, keluhan, diagnosa benar, [salah,salah], ongkos, harga sparepart, tag]
const J=[
["Honda Beat","Susah distarter pagi, mesin batuk-batuk","Busi mati",["Kampas rem","Rantai putus"],45000,20000,"umum"],
["Yamaha Mio","Gas ditarik tapi motor ga mau lari","Belt CVT aus",["Aki soak","Oli kehabisan"],190000,120000,"umum"],
["Honda Supra X","Rantai bunyi kretek-kretek","Rantai dan gir aus",["Busi mati","Shock patah"],160000,100000,"umum"],
["Honda Vario","Rem blong pas turun flyover","Kampas rem habis",["Bohlam putus","Busi mati"],70000,35000,"umum"],
["Revo (ojol)","Mogok pas ada order, lampu redup","Aki soak",["Karburator kotor","Kopling slip"],230000,170000,"ojol"],
["Scoopy (ojol)","Ban belakang kena paku payung","Ban bocor, tambal",["Rantai kendor","Busi basah"],20000,3000,"ojol"],
["NMAX (ojol)","Getar di gas awal, tarikan berat","Roller CVT aus",["Aki soak","Filter udara jebol"],150000,90000,"ojol"],
["Honda Beat","Sudah 4.000 km belum ganti oli, mesin kasar","Oli mesin habis",["Ban gundul","Spion longgar"],55000,38000,"oli"],
["Yamaha Jupiter","Oli kental, mesin kasar dan nyendat","Ganti oli dan filter",["Rem cakram aus","Sein mati"],70000,50000,"oli"],
["Vespa Pak Haji","Mati mendadak di lampu merah","Koil dan kabel busi",["Ban bocor","Kampas rem"],140000,85000,"umum"],
["Vario (ojol)","Lampu depan mati, hujan malam","Bohlam dan sekring",["Oli habis","Kopling slip"],35000,15000,"ojol"],
["Beat Street","Ban depan kempes kena paku","Ban bocor, tambal",["Rantai kendor","Busi basah"],20000,3000,"ban"],
["Supra Fit","Ban belakang kempes lagi","Ban bocor, tambal",["Rem blong","Busi mati"],20000,3000,"ban"],
["Satria FU","Knalpot brong, takut kena razia","Pasang knalpot standar",["Ganti busi","Tambal ban"],320000,250000,"knalpot"]];
const NM=["Bu Wati","Pak Joko","Mas Rizky","Kang Asep","Mbak Sari","Bang Ucok","Pak Haji","Dek Fajar","Bu Ratna","Mas Bagas","Cak Hendra","Neng Dewi"];
const AV=["👨","👩","🧔","👳","🧕","👦","👵","🧑"];
const SAY={ojol:"Cepetan Mas, orderan lagi rame, saldo bisa hangus!",ban:"Bisa kelar sebelum maghrib, Mas?",knalpot:"Jangan sampai kena tilang ya Mas!",oli:"Pokoknya yang bagus tapi harga teman ya.",umum:"Tolong dicek Mas, tadi mendadak gitu."};
const RT={5:["Mekaniknya ramah dan jujur, recommended!","Cepat dan murah. Langganan fix!","Motor langsung enak lagi, mantap Mas Dimas!"],4:["Bagus, tapi tempat nunggunya panas.","Oke, cuma agak lama."],3:["Lumayan, tapi harga agak mahal ya.","Biasa aja sih."],2:["Nunggunya lama banget, ga enak.","Sparepart kok diganti banyak?"],1:["Motor saya malah makin parah, kecewa!","Mekaniknya ga ngerti, jangan ke sini!"]};
const UP=[
{id:"spanduk",n:"Spanduk Servis Cepat",d:"+1 pelanggan tiap hari",p:250000},
{id:"kursi",n:"Kursi Tunggu + Kipas",d:"Pelanggan 30% lebih sabar",p:400000},
{id:"teh",n:"Teh Manis Gratis",d:"+ rating tambahan tiap servis",p:300000},
{id:"manual",n:"Buku Manual Servis",d:"Satu pilihan diagnosa dicoret",p:350000},
{id:"kompresor",n:"Kunci Torsi Digital",d:"Zona hijau mini-game lebih lebar",p:500000},
{id:"rak",n:"Rak Sparepart Grosir",d:"Harga sparepart turun 25%",p:600000},
{id:"dongkrak",n:"Dongkrak Hidrolik",d:"Salah di mini-game tidak potong uang",p:700000},
{id:"papan",n:"Papan Nama Neon",d:"Ongkos servis naik 8%",p:450000},
{id:"sosmed",n:"Akun Sosmed Bengkel",d:"Ulasan bagus menambah pengikut, +1 pelanggan per 20 pengikut",p:350000},
{id:"obd",n:"Scanner OBD",d:"Satu lagi pilihan diagnosa dicoret",p:900000}];
const M=[
{id:1,t:"Pelanggan Pertama",d:"Servis 3 motor",g:3,r:50000,v:()=>S.c.served},
{id:2,t:"Ojol Jangan Mogok",d:"Servis 3 motor ojol",g:3,r:100000,rp:.3,v:()=>S.c.ojol},
{id:3,t:"Telinga Montir",d:"Servis tanpa salah, 5 kali",g:5,r:80000,v:()=>S.c.perfect},
{id:4,t:"Raja Oli",d:"Ganti oli 3 motor",g:3,r:60000,v:()=>S.c.oli},
{id:5,t:"Musim Hujan, Ban Bocor",d:"Tambal 3 ban",g:3,r:70000,v:()=>S.c.ban},
{id:6,t:"Naik Kelas",d:"Beli 2 upgrade",g:2,r:100000,v:()=>Object.keys(S.up).length},
{id:7,t:"Lolos Razia",d:"Ganti 2 knalpot brong",g:2,r:90000,v:()=>S.c.knalpot},
{id:8,t:"Rush Mudik",d:"Servis 25 motor",g:25,r:250000,v:()=>S.c.served},
{id:9,t:"Bengkel Terpercaya",d:"Capai rating 4 bintang",g:4,r:200000,v:()=>Math.floor(S.rep*10)/10},
{id:10,t:"Sultan Bengkel",d:"Servis 60 motor",g:60,r:300000,v:()=>S.c.served}];
const A=[
["first","🔧","Pelanggan Pertama","Selesaikan 1 servis",()=>S.c.served>=1],
["s10","🛵","Montir Muda","Servis 10 motor",()=>S.c.served>=10],
["s50","🏍","Montir Senior","Servis 50 motor",()=>S.c.served>=50],
["pf","👂","Telinga Emas","10 servis tanpa salah",()=>S.c.perfect>=10],
["oj","🟢","Sahabat Ojol","Servis 10 motor ojol",()=>S.c.ojol>=10],
["ban","🛞","Dokter Ban","Tambal 10 ban",()=>S.c.ban>=10],
["oli","🛢","Raja Oli","Ganti oli 8 kali",()=>S.c.oli>=8],
["jur","💰","Juragan Kecil","Punya Rp 1 juta",()=>S.cash>=1e6],
["bin","🌟","Bintang Lima","Rating 4,5",()=>S.rep>=4.5],
["bos","👷","Bos Muda","Rekrut Udin",()=>S.emp>0],
["mod","⚙️","Bengkel Modern","Punya 5 upgrade",()=>Object.keys(S.up).length>=5],
["fan","💬","Fans Berat","10 ulasan bintang 5",()=>S.c.five>=10],
["tt","📱","Selebgram Bengkel","50 pengikut",()=>S.fol>=50],
["sw","🏠","Rajin Bayar","Lunasi sewa 3 kali",()=>S.c.sewa>=3]];
const STORY={
1:["🏚 Pulang Kampung","Kamu Dimas. Bulan lalu pabrik tempatmu kerja di Cikarang PHK massal, jadi kamu pulang. Bapak, Pak Slamet, sedang dirawat. Bengkel Jaya Motor yang ia rawat 20 tahun hampir tutup.<br><br>Pak Haji Darto, pemilik lapak: <i>“Dim, sewa Rp 300 ribu per minggu. Kalau dalam 30 hari kamu punya Rp 4 juta, lapak ini saya lepas ke kamu.”</i><br><br>Ingat, tambal ban cuma Rp 20 ribu. Untung tipis, jadi putar otak."],
3:["📞 Telepon Ibu","<i>“Le, jangan lupa makan. Bapak nanyain bengkel terus. Obatnya mahal, tapi kamu jangan terlalu dipikirin.”</i><br><br>Kamu menggenggam kunci pas lebih erat."],
8:["🛵 Kang Asep","Kang Asep, ketua komunitas ojol, mampir. <i>“Mas, bengkelnya enak. Nanti saya ajak anak-anak.”</i><br><br>Ojol makin sering datang, tapi mereka tidak sabaran."],
15:["🎥 Video Call Bapak","Bapak sudah bisa duduk. <i>“Ban motor orang itu bukan cuma ban, Le. Itu jalan hidupnya.”</i><br><br>Kamu menahan air mata, lalu pura-pura sibuk pasang gir."],
20:["⚠️ Ada Peminat Lain","Pak Haji bilang ada orang lain yang melirik lapak ini. <i>“Saya tunggu sampai hari ke-30, Dim.”</i>"],
25:["🌙 Musim Mudik","Jalanan ramai pemudik. Antrean memanjang sampai ke trotoar."]};
const EV=[
{t:"🌧 Hujan Deras",b:"Hujan seharian. Banyak motor kena paku di jalan banjir.",a:[["Buka lapak lebih lebar",()=>{S.q.push(mk("ban"),mk("ban"))}]]},
{t:"🚔 Razia Knalpot",b:"Polisi razia di perempatan. Anak muda panik cari knalpot standar.",a:[["Siap melayani",()=>{S.q.push(mk("knalpot"),mk("knalpot"))}]]},
{t:"🕶 Preman Minta Jatah",b:"<i>“Uang keamanan, Bang. Lima puluh ribu aja.”</i>",a:[["Kasih Rp 50 ribu",()=>{S.cash=Math.max(0,S.cash-50000)}],["Ajak ngopi dan ngobrol",()=>{if(Math.random()<.5){rp(.1);toast("Preman pergi, malah jadi kenalan")}else{S.cash=Math.max(0,S.cash-50000);rp(-.1);toast("Gagal, tetap bayar Rp 50 ribu")}}]]},
{t:"🇮🇩 Panitia 17-an",b:"Pak RT datang bawa proposal lomba balap karung.",a:[["Sumbang Rp 30 ribu",()=>{S.cash=Math.max(0,S.cash-30000);rp(.2)}],["Besok ya Pak",()=>rp(-.2)]]},
{t:"💡 Listrik Padam",b:"PLN padam, kompresor mati.",a:[["Sewa genset Rp 40 ribu",()=>{S.cash=Math.max(0,S.cash-40000)}],["Tunggu PLN nyala",()=>{S.q.forEach(c=>c.p-=30)}]]}];
let S,busy=false,tm=0,started=0,u=0;
const fresh=()=>({day:1,cash:150000,rep:2,q:[],up:{},md:{},ach:{},rv:[],fol:0,emp:0,c:{served:0,ojol:0,perfect:0,oli:0,ban:0,knalpot:0,earned:0,sewa:0,five:0}});
const rp=d=>S.rep=Math.max(0,Math.min(5,S.rep+d)),pcOf=c=>Math.round(c.j[5]*(S.up.rak?.75:1));
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{const x=localStorage.getItem(SAVE);return x?JSON.parse(x):null}catch(e){return null}}
const TQ=[];let tb=0;
function toast(t){TQ.push(t);if(!tb)nt()}
function nt(){const e=$("#toast");if(!TQ.length){tb=0;e.classList.remove("on");return}tb=1;e.textContent=TQ.shift();e.classList.add("on");setTimeout(nt,2300)}
function modal(h){$("#box").innerHTML=h;$("#modal").hidden=false;busy=true}
function close(){clearInterval(tm);$("#modal").hidden=true;busy=false}
function dlg(t,b,btns){modal(`<h3>${t}</h3><div class="tx">${b}</div>`+btns.map((x,i)=>`<button class="b ${i?"":"p"}" data-i="${i}">${x[0]}</button>`).join(""));
 $("#box").querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{close();const fn=btns[el.dataset.i][1];fn&&fn()})}
function mk(tag){const p=tag?J.filter(j=>j[6]==tag):J;return{j:p[R(p.length)],n:NM[R(NM.length)],av:AV[R(AV.length)],p:100}}
function addRv(c,s,t){S.rv.unshift({n:c.n,s,t:t||RT[s][R(RT[s].length)],r:s>3?1:0});S.rv.length=Math.min(S.rv.length,40);
 if(s==5)S.c.five++;if(S.up.sosmed)S.fol+=s==5?3:s==4?1:0}
function chk(){M.forEach(m=>{if(!S.md[m.id]&&m.v()>=m.g){S.md[m.id]=1;S.cash+=m.r;rp(m.rp||0);toast(`🎯 Misi selesai: ${m.t}! +Rp ${f(m.r)}`)}});
 A.forEach(a=>{if(!S.ach[a[0]]&&a[4]()){S.ach[a[0]]=1;toast(`🏅 Badge baru: ${a[2]}`)}})}
function render(){
 $("#day").textContent=`Hari ${S.day}/${MAXDAY}`;$("#rep").textContent="⭐ "+S.rep.toFixed(1);$("#cash").textContent="Rp "+f(S.cash);
 const r=S.day%7===0?0:7-S.day%7,P=S.rv.filter(x=>!x.r&&x.s<=3).length;
 $("#g1").textContent="Target beli lapak Rp "+f(TARGET);$("#g2").textContent=r?`Sewa ${r} hari lagi`:"Sewa jatuh tempo hari ini";
 $("#gbar").style.width=Math.min(100,S.cash/TARGET*100)+"%";$("#bv").textContent="💬 Ulasan"+(P?` (${P})`:"");
 $("#queue").innerHTML=S.q.length?S.q.map((c,i)=>`<div class="card ${c.j[6]=="ojol"?"oj":""}" data-i="${i}"><div class="av">${c.av}</div><div class="inf"><b>${c.n}</b>${c.j[6]=="ojol"?"<i>OJOL</i>":""}<br><small>${c.j[0]}: ${c.j[1]}</small><div class="pb"><span style="width:${Math.max(0,c.p)}%"></span></div></div><div class="fee">Rp ${f(c.j[4])}</div></div>`).join(""):`<div class="empty">Antrean kosong. Tutup bengkel atau tunggu hari esok.</div>`;
 $("#queue").querySelectorAll(".card").forEach(el=>el.onclick=()=>work(+el.dataset.i));
 const act=M.filter(m=>!S.md[m.id]).slice(0,3);
 $("#ms").innerHTML=act.length?act.map(m=>{const v=Math.min(m.v(),m.g);return`<div class="m"><b>🎯 ${m.t}</b><small>${m.d}</small><div class="pb"><span style="width:${v/m.g*100}%"></span></div><small>${v}/${m.g}, hadiah Rp ${f(m.r)}</small></div>`}).join(""):`<div class="empty">Semua misi selesai. Kamu legenda bengkel!</div>`}
function torque(b,done,pen){
 let hits=0,pos=0,dir=1,z=0;const w=S.up.kompresor?26:16;
 b.innerHTML=`<h4>Kencangkan 3 baut: tekan pas di zona hijau!</h4><div class="tb"><i id="gz"></i><b id="mk"></b></div><button class="b p tap" id="tp">🔩 Kencangkan (0/3)</button>`;
 const gz=$("#gz"),mkr=$("#mk"),bt=$("#tp"),pl=()=>{z=5+R(90-w);gz.style.left=z+"%";gz.style.width=w+"%"};pl();
 tm=setInterval(()=>{pos+=dir*1.7;if(pos>=100||pos<=0)dir=-dir;mkr.style.left=pos+"%"},16);
 bt.onclick=()=>{if(pos>=z&&pos<=z+w){hits++;bt.textContent=`🔩 Kencangkan (${hits}/3)`;if(hits>=3){clearInterval(tm);done()}else pl()}else{pen();toast("Baut dol! Coba lagi")}}}
function urut(b,done,pen){
 const L=["Buka cover","Lepas komponen lama","Pasang komponen baru","Kencangkan baut"];let n=0;
 b.innerHTML=`<h4>Tap sesuai urutan kerja yang benar!</h4>`+[0,1,2,3].sort(()=>Math.random()-.5).map(k=>`<button class="b" data-k="${k}">${L[k]}</button>`).join("");
 b.querySelectorAll("[data-k]").forEach(el=>el.onclick=()=>{if(+el.dataset.k===n){el.disabled=true;el.textContent="✔ "+L[n];n++;if(n>3)done()}else{pen();toast("Salah urutan!")}})}
function work(i){
 const c=S.q[i];if(!c||busy)return;let wrong=0;const pc=pcOf(c);
 let o=[c.j[2],...c.j[3]];for(let k=(S.up.manual?1:0)+(S.up.obd?1:0);k>0&&o.length>1;k--)o.splice(1+R(o.length-1),1);o.sort(()=>Math.random()-.5);
 modal(`<h3>🛵 ${c.j[0]}</h3><p><b>${c.n}:</b> “${c.j[1]}”</p><p class="hint">${SAY[c.j[6]]||SAY.umum}</p><div id="ph1"><h4>Diagnosa kamu?</h4>${o.map(x=>`<button class="b" data-x="${x}">${x}</button>`).join("")}<button class="b x" id="no">Nanti dulu</button></div><div id="ph2" hidden></div>`);
 $("#no").onclick=close;
 const pen=()=>{wrong++;if(!S.up.dongkrak)S.cash=Math.max(0,S.cash-Math.round(pc/4));rp(-.03);render()};
 $("#box").querySelectorAll("[data-x]").forEach(el=>el.onclick=()=>{
  if(el.dataset.x===c.j[2]){$("#ph1").hidden=true;const b=$("#ph2");b.hidden=false;(Math.random()<.5?torque:urut)(b,()=>{close();finish(c,wrong,0)},pen);return}
  wrong++;el.disabled=true;el.style.opacity=.35;S.cash=Math.max(0,S.cash-Math.round(pc/2));rp(-.1);c.p-=8;render();toast("❌ Salah diagnosa, sparepart kebuang setengah")})}
function finish(c,wrong,ud){
 const pc=pcOf(c),fee=Math.round(c.j[4]*(S.up.papan?1.08:1)),tip=S.rep>=4?Math.round(fee*.1):0,bonus=c.j[6]=="ojol"&&c.p>50?15000:0,net=fee+tip+bonus-pc,t=c.j[6];
 S.cash+=net;S.c.served++;S.c.earned+=net;if(t=="ojol"||t=="oli"||t=="knalpot")S.c[t]++;if(c.j[2].startsWith("Ban bocor"))S.c.ban++;
 if(!wrong&&!ud)S.c.perfect++;rp((wrong?.03:.1)+(S.up.teh?.05:0));
 let st=5-(wrong?1:0)-(wrong>1?1:0)-(c.p<35?1:0)-(Math.random()<.12?1:0);if(ud)st=Math.min(st,4);addRv(c,Math.max(1,st));
 S.q.splice(S.q.indexOf(c),1);chk();render();save();
 toast(`✅ ${ud?"Udin: ":""}${c.n} ${"⭐".repeat(Math.max(1,st))} +Rp ${f(net)}${bonus?" (bonus ojol)":""}`)}
function udin(){
 const c=S.q.find(x=>x.j[6]!="ojol"&&x.j[6]!="knalpot");if(!c)return;
 if(Math.random()<.8)finish(c,0,1);else{S.cash=Math.max(0,S.cash-Math.round(pcOf(c)/2));rp(-.1);addRv(c,1,"Udin salah pasang, motor saya mogok lagi.");S.q.splice(S.q.indexOf(c),1);toast("😬 Udin salah pasang, pelanggan kecewa");render();save()}}
function shop(){
 modal(`<h3>🛠 Upgrade Bengkel</h3><button class="b up" id="hu" ${S.emp?"disabled":""}><span>👷 Rekrut Udin (magang)<small>Melayani pelanggan non-ojol otomatis, 80% berhasil. Gaji Rp ${f(GAJI)}/hari</small></span><span>${S.emp?"Bekerja":"Rp 150.000"}</span></button>`+UP.map(x=>`<button class="b up" data-u="${x.id}" ${S.up[x.id]?"disabled":""}><span>${x.n}<small>${x.d}</small></span><span>${S.up[x.id]?"Terpasang":"Rp "+f(x.p)}</span></button>`).join("")+`<button class="b x" id="no">Tutup</button>`);
 $("#no").onclick=close;
 $("#hu").onclick=()=>{if(S.cash<150000)return toast("Uang belum cukup");S.cash-=150000;S.emp=1;chk();save();render();shop();toast("Udin mulai kerja!")};
 $("#box").querySelectorAll("[data-u]").forEach(el=>el.onclick=()=>{const x=UP.find(y=>y.id===el.dataset.u);
  if(S.cash<x.p)return toast("Uang belum cukup");S.cash-=x.p;S.up[x.id]=1;chk();save();render();shop();toast("Terpasang: "+x.n)})}
function rvw(){
 modal(`<h3>💬 Ulasan Pelanggan</h3><p class="hint">${S.up.sosmed?"📱 Pengikut: "+S.fol:"Beli Akun Sosmed di Upgrade supaya pengikut bertambah."}</p>`+(S.rv.length?S.rv.slice(0,12).map((r,i)=>`<div class="rv ${!r.r?"bad":""}" data-i="${i}"><b>${r.n}</b> ${"⭐".repeat(r.s)}<br><small>${r.t}</small>${!r.r?'<br><small style="color:var(--ac)">Tap untuk membalas</small>':""}</div>`).join(""):`<div class="empty">Belum ada ulasan.</div>`)+`<button class="b x" id="no">Tutup</button>`);
 $("#no").onclick=close;
 $("#box").querySelectorAll(".rv.bad").forEach(el=>el.onclick=()=>{const r=S.rv[+el.dataset.i],done=()=>{r.r=1;save();render();rvw()};
  dlg("Balas ulasan",`<b>${r.n}</b> ${"⭐".repeat(r.s)}<br>“${r.t}”`,[["Balas sopan",()=>{rp(.05);done()}],["Minta maaf + diskon Rp 20 ribu",()=>{S.cash=Math.max(0,S.cash-20000);rp(.15);done()}],["Balas ketus",()=>{rp(-.25);done()}]])})}
function badges(){
 modal(`<h3>🏅 Badge</h3><p class="hint">${Object.keys(S.ach).length}/${A.length} terkumpul</p><div class="bg">`+A.map(a=>`<div class="bd ${S.ach[a[0]]?"":"lk"}"><span class="e">${a[1]}</span><b>${a[2]}</b><br>${a[3]}</div>`).join("")+`</div><button class="b x" id="no">Tutup</button>`);$("#no").onclick=close}
function newDay(){
 const n=4+(S.rep>=3?1:0)+(S.rep>=4?1:0)+(S.up.spanduk?1:0)+(S.up.sosmed?Math.min(3,S.fol/20|0):0)+(S.day>=25&&S.day<=28?2:0);
 S.q=[];for(let i=0;i<n;i++)S.q.push(mk());save();render();
 const go=()=>{if(S.day>1&&Math.random()<.5){const e=EV[R(EV.length)];dlg(e.t,e.b,e.a.map(a=>[a[0],()=>{a[1]();render();save()}]))}};
 const st=STORY[S.day];st?dlg(st[0],st[1],[["Lanjut",go]]):go()}
function over(t){try{localStorage.removeItem(SAVE)}catch(e){}dlg("💔 Game Over",t,[["Coba lagi dari awal",()=>{S=fresh();newDay()}]])}
function win(){dlg("🏆 Lapak Jadi Milikmu!","Pak Haji menyerahkan surat lapak. Kamu memasang spanduk baru: <b>BENGKEL SLAMET JAYA, sejak 2003</b>.<br><br>Video call ke rumah sakit. Bapak tersenyum, ibu menangis, dan antrean ojol sudah menunggu di depan.<br><br>Total servis: "+S.c.served+" motor.",[["Main lagi",()=>{S=fresh();newDay()}]])}
function endDay(){
 S.q.forEach(()=>rp(-.2));S.q=[];
 const bad=S.rv.filter(r=>!r.r&&r.s<=2&&!r.pn);bad.forEach(r=>{r.pn=1;rp(-.1)});
 let t=`Makan dan listrik: Rp ${f(MAKAN)}.`;S.cash=Math.max(0,S.cash-MAKAN);
 if(S.emp){S.cash=Math.max(0,S.cash-GAJI);t+=` Gaji Udin: Rp ${f(GAJI)}.`}
 if(bad.length)t+=` ${bad.length} ulasan jelek belum dibalas, rating turun.`;
 if(S.day%7===0){const s=S.day>14?350000:300000;
  if(S.cash<s)return over(`Uangmu Rp ${f(S.cash)}, sewa Rp ${f(s)} tidak terbayar. Pak Haji dengan berat hati menyuruhmu angkat barang. Bengkel Jaya Motor tutup.`);
  S.cash-=s;S.c.sewa++;t+=` Sewa lapak ke Pak Haji: Rp ${f(s)}.`}
 chk();if(S.cash>=TARGET)return win();
 if(S.day>=MAXDAY)return over("Hari ke-30 tiba, tabunganmu belum Rp 4 juta. Lapak dijual ke orang lain. Tapi kamu tahu, bengkel kecil lain menunggu.");
 S.day++;dlg("🌙 Hari "+(S.day-1)+" selesai",t+`<br>Uangmu sekarang Rp ${f(S.cash)}.`,[["Buka bengkel hari "+S.day,newDay]])}
$("#bu").onclick=()=>{if(!busy)shop()};$("#bv").onclick=()=>{if(!busy)rvw()};$("#bb").onclick=()=>{if(!busy)badges()};
$("#bt").onclick=()=>{if(busy)return;dlg("Tutup bengkel?",S.q.length?"Masih ada "+S.q.length+" pelanggan menunggu. Kalau ditinggal, rating turun.":"Semua pelanggan sudah dilayani.",[["Ya, tutup",endDay],["Belum dulu"]])};
$("#br").onclick=()=>{if(busy)return;dlg("Ulang dari awal?","Semua progres akan dihapus.",[["Ya, ulang",()=>{S=fresh();newDay()}],["Batal"]])};
setInterval(()=>{if(busy||!started)return;
 if(S.q.length){const k=S.up.kursi?.7:1;S.q.forEach(c=>c.p-=(c.j[6]=="ojol"?2.2:1.2)*k);
  S.q=S.q.filter(c=>{if(c.p<=0){rp(-.3);addRv(c,1,"Nunggu kelamaan, akhirnya saya pulang.");toast(`😤 ${c.n} pergi, kelamaan nunggu`);return false}return true})}
 if(S.emp&&S.q.length&&++u>=14){u=0;udin()}
 render()},1000);
const loaded=load();S=loaded||fresh();render();
const TX=["Memanaskan mesin...","Menyusun kunci pas...","Menyapu oli di lantai...","Menyalakan kompresor..."];let pg=0;
const sv=setInterval(()=>{pg+=2.5;$("#spb").style.width=Math.min(pg,100)+"%";if(pg<100)$("#spt").textContent=TX[Math.min(3,pg/25|0)];
 else{clearInterval(sv);$("#sp").classList.add("rdy");$("#spt").textContent=loaded?`Ketuk untuk lanjut (Hari ${S.day})`:"Ketuk untuk mulai"}},70);
$("#sp").onclick=()=>{if(pg<100)return;$("#sp").classList.add("off");if(started)return;started=1;if(!loaded)newDay()};
</script>
</body>
</html>
